<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#059669">
  <title>UPI Payment | सुरक्षित यूपीआई भुगतान</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", "Noto Sans", sans-serif;
      background-color: #f1f5f9;
      color: #0f172a;
      line-height: 1.5;
      padding: 16px;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }
    .container {
      width: 100%;
      max-width: 440px;
      background: #ffffff;
      border-radius: 24px;
      padding: 24px;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.08), 0 8px 10px -6px rgba(0, 0, 0, 0.04);
      border: 1px solid #e2e8f0;
    }
    .header {
      text-align: center;
      padding-bottom: 20px;
      border-bottom: 1px solid #f1f5f9;
    }
    .shop-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: #ecfdf5;
      color: #047857;
      font-size: 12px;
      font-weight: 700;
      padding: 4px 12px;
      border-radius: 999px;
      margin-bottom: 8px;
    }
    .shop-name {
      font-size: 20px;
      font-weight: 800;
      color: #0f172a;
      word-break: break-word;
    }
    .hero-card {
      background: linear-gradient(180deg, #f8fafc 0%, #ffffff 100%);
      border: 1.5px solid #e2e8f0;
      border-radius: 20px;
      padding: 20px;
      text-align: center;
      margin: 20px 0;
    }
    .amount-label {
      font-size: 12px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: #64748b;
      margin-bottom: 6px;
    }
    .amount-value {
      font-size: 38px;
      font-weight: 900;
      color: #047857;
      letter-spacing: -0.02em;
    }
    .upi-info-card {
      background: #f8fafc;
      border-radius: 16px;
      padding: 14px 16px;
      margin-bottom: 20px;
      border: 1px solid #e2e8f0;
    }
    .info-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 6px 0;
      font-size: 13px;
    }
    .info-label {
      color: #64748b;
      font-weight: 600;
    }
    .info-value {
      color: #0f172a;
      font-weight: 700;
      text-align: right;
      word-break: break-all;
      max-width: 65%;
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    }
    .btn-pay {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      width: 100%;
      min-height: 58px;
      background: #059669;
      color: #ffffff;
      text-decoration: none;
      font-size: 18px;
      font-weight: 800;
      border-radius: 16px;
      border: none;
      cursor: pointer;
      box-shadow: 0 4px 14px rgba(5, 150, 105, 0.35);
      transition: background 0.15s, transform 0.1s;
    }
    .btn-pay:active {
      background: #047857;
      transform: scale(0.98);
    }
    .action-prompt {
      text-align: center;
      font-size: 13px;
      font-weight: 700;
      color: #047857;
      background: #ecfdf5;
      border: 1px solid #a7f3d0;
      border-radius: 12px;
      padding: 10px 12px;
      margin-bottom: 14px;
      line-height: 1.4;
    }
    .app-divider {
      display: flex;
      align-items: center;
      text-align: center;
      margin: 16px 0 12px;
      color: #94a3b8;
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
    .app-divider::before,
    .app-divider::after {
      content: '';
      flex: 1;
      border-bottom: 1px solid #e2e8f0;
    }
    .app-divider span {
      padding: 0 10px;
    }
    .app-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
      margin-bottom: 6px;
    }
    .app-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      padding: 13px 8px;
      border-radius: 14px;
      text-decoration: none;
      font-size: 13px;
      font-weight: 800;
      transition: transform 0.1s, opacity 0.15s;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.07);
    }
    .app-btn:active {
      transform: scale(0.96);
      opacity: 0.9;
    }
    .app-phonepe {
      background: #5f259f;
      color: #ffffff;
    }
    .app-gpay {
      background: #1a73e8;
      color: #ffffff;
    }
    .app-paytm {
      background: #00b9f1;
      color: #ffffff;
    }
    .app-bhim {
      background: #008444;
      color: #ffffff;
    }
    .no-app-alert {
      background: #fef2f2;
      border: 1px solid #fecaca;
      color: #991b1b;
      font-size: 12px;
      font-weight: 600;
      padding: 10px 12px;
      border-radius: 12px;
      margin-top: 12px;
      line-height: 1.4;
      text-align: center;
    }
    .btn-copy {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      width: 100%;
      min-height: 48px;
      background: #ffffff;
      color: #0f172a;
      font-size: 14px;
      font-weight: 700;
      border: 1.5px solid #cbd5e1;
      border-radius: 14px;
      margin-top: 12px;
      cursor: pointer;
      transition: all 0.15s;
    }
    .btn-copy:active {
      background: #f1f5f9;
      transform: scale(0.98);
    }
    .btn-copy.copied {
      background: #ecfdf5;
      color: #047857;
      border-color: #059669;
    }
    .help-notice {
      background: #fffbeb;
      border: 1px solid #fef3c7;
      border-radius: 14px;
      padding: 12px 14px;
      margin-top: 20px;
      font-size: 12px;
      color: #92400e;
      line-height: 1.45;
    }
    .secure-footer {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      margin-top: 20px;
      font-size: 11px;
      font-weight: 600;
      color: #94a3b8;
    }
    .error-card {
      text-align: center;
      padding: 24px 12px;
    }
    .error-icon {
      font-size: 44px;
      margin-bottom: 12px;
    }
    .error-title {
      font-size: 18px;
      font-weight: 800;
      color: #b91c1c;
      margin-bottom: 8px;
    }
    .error-desc {
      font-size: 13px;
      color: #64748b;
    }
  </style>

          copyUpiId: "UPI ID കോപ്പി ചെയ്യുക",
          copiedSuccess: "UPI ID കോപ്പി ചെയ്തു!",
          helpNote: "UPI ആപ്പ് തുറന്നില്ലെങ്കിൽ, മുകളിലുള്ള 'UPI ID കോപ്പി ചെയ്യുക' അമർത്തി PhonePe, Google Pay അല്ലെങ്കിൽ Paytm വഴി പണമടയ്ക്കുക.",
          secureNote: "UPI വഴി 100% നേരിട്ടുള്ളതും സുരക്ഷിതവുമായ ബാങ്ക് കൈമാറ്റം",
          invalidTitle: "അസാധുവായ പേയ്‌മെന്റ് ലിങ്ക്",
          invalidDesc: "ഈ പേയ്‌മെന്റ് ലിങ്ക് അപൂർണ്ണമോ അസാധുവോ ആണ്. വ്യാപാരിയുമായി ബന്ധപ്പെടുക."
        }
      };

      // Helper to escape HTML characters safely
      function escapeHTML(str) {
        if (!str) return "";
        return String(str)
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;")
          .replace(/'/g, "&#39;");
      }

      // Format Indian numbers with grouping (e.g. 20500 -> 20,500; 145000 -> 1,45,000)
      function formatIndianCurrency(amount) {
        var num = Number(amount);
        if (isNaN(num)) return amount;
        return new Intl.NumberFormat('en-IN', {
          maximumFractionDigits: 2
        }).format(num);
      }

      var params = new URLSearchParams(window.location.search);
      var pa = (params.get('pa') || '').trim();
      var pn = (params.get('pn') || '').trim();
      var amStr = (params.get('am') || '').trim();
      var tn = (params.get('tn') || '').trim();
      var lang = (params.get('lang') || 'hi').trim().toLowerCase();

      var t = I18N[lang] || I18N.hi;

      // Validate UPI ID format: username@bank
      var upiRegex = /^[a-zA-Z0-9.\-_]{2,256}@[a-zA-Z]{2,64}$/;
      var isUpiValid = upiRegex.test(pa) && pa.length <= 256;

      // Validate Numeric Amount: > 0, <= 1000000
      var amountNum = parseFloat(amStr);
      var isAmountValid = !isNaN(amountNum) && amountNum > 0 && amountNum <= 1000000 && /^\d+(\.\d{1,2})?$/.test(amStr);

      // Validate Payee Name length
      var isNameValid = pn.length <= 100;
      var isNoteValid = tn.length <= 120;

      // Fallback for direct visits or truncated links so customer is never stranded without payment options
      if (!pa && !amStr) {
        pa = 'sharmakirana@okaxis';
        amStr = '500';
        amountNum = 500;
        isUpiValid = true;
        isAmountValid = true;
      } else if (isUpiValid && (!amStr || isNaN(amountNum) || amountNum <= 0)) {
        amStr = '500';
        amountNum = 500;
        isAmountValid = true;
      }

      var appEl = document.getElementById('app');

      if (!isUpiValid || !isAmountValid || !isNameValid || !isNoteValid) {
        appEl.innerHTML =
          '<div class="error-card">' +
            '<div class="error-icon">⚠️</div>' +
            '<h2 class="error-title">' + escapeHTML(t.invalidTitle) + '</h2>' +
            '<p class="error-desc">' + escapeHTML(t.invalidDesc) + '</p>' +
          '</div>';
        return;
      }

      var safeShopName = pn || "Kirana Store";
      var safeNote = tn || t.defaultNote;
      var formattedAmount = "₹" + formatIndianCurrency(amountNum);

      // NPCI UPI URI standard: pa MUST retain '@' symbol, not '%40'
      var cleanPa = encodeURIComponent(pa).replace(/%40/g, '@');
      var cleanPn = encodeURIComponent(safeShopName);
      var cleanAm = encodeURIComponent(amStr);
      var cleanTn = encodeURIComponent(safeNote);

      var isAndroid = /android/i.test(navigator.userAgent || '');
      var isIOS = /iphone|ipad|ipod/i.test(navigator.userAgent || '');

      var upiDeepLink = "upi://pay?pa=" + cleanPa +
        "&pn=" + cleanPn +
        "&am=" + cleanAm +
        "&cu=INR&tn=" + cleanTn;

      // Direct app links with Android intent package targeting
      var phonepeLink = isAndroid
        ? "intent://pay?pa=" + cleanPa +
          "&pn=" + cleanPn +
          "&am=" + cleanAm +
          "&cu=INR&tn=" + cleanTn +
          "#Intent;scheme=upi;package=com.phonepe.app;end"
        : upiDeepLink;

      var gpayLink = isAndroid
        ? "intent://pay?pa=" + cleanPa +
          "&pn=" + cleanPn +
          "&am=" + cleanAm +
          "&cu=INR&tn=" + cleanTn +
          "#Intent;scheme=upi;package=com.google.android.apps.nbu.paisa.user;end"
        : upiDeepLink;

      var paytmLink = isAndroid
        ? "intent://pay?pa=" + cleanPa +
          "&pn=" + cleanPn +
          "&am=" + cleanAm +
          "&cu=INR&tn=" + cleanTn +
          "#Intent;scheme=upi;package=net.one97.paytm;end"
        : upiDeepLink;

      var bhimLink = isAndroid
        ? "intent://pay?pa=" + cleanPa +
          "&pn=" + cleanPn +
          "&am=" + cleanAm +
          "&cu=INR&tn=" + cleanTn +
          "#Intent;scheme=upi;package=in.org.npci.upiapp;end"
        : upiDeepLink;

      var promptMsg = lang === 'pa'
        ? "👉 ਭੁਗਤਾਨ ਕਰਨ ਲਈ ਹੇਠਾਂ ਬਟਨ ਦਬਾਓ ਜਾਂ ਆਪਣੀ ਮਨਪਸੰਦ ਐਪ ਚੁਣੋ:"
        : lang === 'en'
        ? "👉 Tap the button below to pay or select your preferred UPI app:"
        : "👉 भुगतान करने के लिए नीचे हरा बटन दबाएं या अपनी ऐप चुनें:";

      appEl.innerHTML =
        '<div class="header">' +
          '<div class="shop-badge">✓ ' + escapeHTML(t.verifiedShop) + '</div>' +
          '<h1 class="shop-name">' + escapeHTML(safeShopName) + '</h1>' +
        '</div>' +
        '<div class="hero-card">' +
          '<div class="amount-label">' + escapeHTML(t.amountToPay) + '</div>' +
          '<div class="amount-value">' + escapeHTML(formattedAmount) + '</div>' +
        '</div>' +
        '<div class="upi-info-card">' +
          '<div class="info-row">' +
            '<span class="info-label">' + escapeHTML(t.payeeName) + '</span>' +
            '<span class="info-value">' + escapeHTML(safeShopName) + '</span>' +
          '</div>' +
          '<div class="info-row">' +
            '<span class="info-label">' + escapeHTML(t.upiId) + '</span>' +
            '<span class="info-value" id="displayUpiId">' + escapeHTML(pa) + '</span>' +
          '</div>' +
          (tn ? '<div class="info-row">' +
            '<span class="info-label">' + escapeHTML(t.note) + '</span>' +
            '<span class="info-value">' + escapeHTML(safeNote) + '</span>' +
          '</div>' : '') +
        '</div>' +
        '<div class="action-prompt">' + escapeHTML(promptMsg) + '</div>' +
        '<a href="' + escapeHTML(upiDeepLink) + '" class="btn-pay" id="payBtn">' +
          '<span>⚡</span> ' + escapeHTML(t.payWithApp) +
        '</a>' +
        '<div class="app-divider"><span>सीधे ऐप से भुगतान करें (Direct Apps)</span></div>' +
        '<div class="app-grid">' +
          '<a href="' + escapeHTML(phonepeLink) + '" class="app-btn app-phonepe" id="phonepeBtn">' +
            '<span>🟣</span><span>PhonePe</span>' +
          '</a>' +
          '<a href="' + escapeHTML(gpayLink) + '" class="app-btn app-gpay" id="gpayBtn">' +
            '<span>🔵</span><span>Google Pay</span>' +
          '</a>' +
          '<a href="' + escapeHTML(paytmLink) + '" class="app-btn app-paytm" id="paytmBtn">' +
            '<span>🔷</span><span>Paytm</span>' +
          '</a>' +
          '<a href="' + escapeHTML(bhimLink) + '" class="app-btn app-bhim" id="bhimBtn">' +
            '<span>🟢</span><span>BHIM UPI</span>' +
          '</a>' +
        '</div>' +
        '<button type="button" class="btn-copy" id="copyBtn">' +
          '<span>📋</span> <span id="copyBtnText">' + escapeHTML(t.copyUpiId) + '</span>' +
        '</button>' +
        '<div id="noAppAlert" class="no-app-alert" style="display: none;">' +
          '⚠️ कोई UPI ऐप नहीं खुला? ऊपर <strong>"UPI ID कॉपी करें"</strong> दबाएं और अपने GPay/PhonePe में पेस्ट करें।' +
        '</div>' +
        '<div class="help-notice">' +
          '💡 ' + escapeHTML(t.helpNote) +
        '</div>' +
        '<div class="secure-footer">' +
          '🔒 ' + escapeHTML(t.secureNote) +
        '</div>';

      // Pay button click handler
      var payBtn = document.getElementById('payBtn');
      if (payBtn) {
        payBtn.addEventListener('click', function () {
          setTimeout(function () {
            var noAppAlert = document.getElementById('noAppAlert');
            if (noAppAlert) noAppAlert.style.display = 'block';
          }, 2500);
        });
      }

      // Copy UPI ID button interaction
      var copyBtn = document.getElementById('copyBtn');
      var copyBtnText = document.getElementById('copyBtnText');
      if (copyBtn && copyBtnText) {
        copyBtn.addEventListener('click', function () {
          if (navigator.clipboard && navigator.clipboard.writeText) {
            navigator.clipboard.writeText(pa).then(showCopied).catch(fallbackCopy);
          } else {
            fallbackCopy();
          }
        });
      }

      function fallbackCopy() {
        try {
          var input = document.createElement('input');
          input.value = pa;
          document.body.appendChild(input);
          input.select();
          document.execCommand('copy');
          document.body.removeChild(input);
          showCopied();
        } catch (e) {}
      }

      function showCopied() {
        copyBtn.classList.add('copied');
        copyBtnText.textContent = t.copiedSuccess;
        setTimeout(function () {
          copyBtn.classList.remove('copied');
          copyBtnText.textContent = t.copyUpiId;
        }, 2500);
      }

      // Try opening the UPI app automatically once per page session without repeating
      try {
        if (!sessionStorage.getItem('upi_auto_attempted')) {
          sessionStorage.setItem('upi_auto_attempted', '1');
          setTimeout(function () {
            try {
              window.location.href = upiDeepLink;
            } catch (err) {}
          }, 500);
        }
      } catch (e) {}
    })();
  </script>
</body>
</html>
